[package]
name = "edgalaxy"
version = "0.1.0"
edition = "2021"
description = "Elite Dangerous StellarForge data explorer: authored systems, procedural naming, regions, density"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
